name: Import lieux Google Places

on:
  workflow_dispatch:  # déclenchement manuel uniquement (opération ponctuelle)

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # le script peut prendre du temps (appels API Claude x lieu)
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install @supabase/supabase-js nodemailer

      - name: Import lieux via Google Places + descriptions Claude
        run: node scripts/import-lieux-google.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD_MODERATION: ${{ secrets.GMAIL_APP_PASSWORD_MODERATION }}
