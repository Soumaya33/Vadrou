name: Tests Non-Régression Vadrou

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests Playwright sur vadrou.com
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Installer Playwright (Chromium uniquement)
        run: |
          npm init -y
          npm install --save-dev @playwright/test
          npx playwright install chromium --with-deps

      - name: Attendre que Vercel ait déployé (30s)
        run: sleep 30

      - name: Lancer les tests
        run: npx playwright test tests/vadrou.spec.js --reporter=json,html || true
        env:
          BASE_URL: https://vadrou.com
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json

      - name: Générer le résumé email
        if: always()
        run: |
          python3 << 'PYEOF'
          import json, os, datetime

          # Nombre de tests attendus (32 actifs + 1 skippé = 33). En dessous, le run est incomplet.
          EXPECTED_MIN = 30

          # Lire les résultats JSON
          results_ok = True
          try:
              with open('results.json', 'r') as f:
                  data = json.load(f)
          except Exception:
              data = {'suites': [], 'stats': {}}
              results_ok = False

          stats = data.get('stats', {})
          passed   = stats.get('expected', 0)
          failed   = stats.get('unexpected', 0)
          skipped  = stats.get('skipped', 0)
          total    = passed + failed + skipped
          duration = round(stats.get('duration', 0) / 1000)

          # Statut honnête : un run vide ou incomplet n'est PAS un succès.
          if not results_ok or total == 0:
              status_emoji = "❌"
              status_text  = "ÉCHEC — aucun test exécuté (run interrompu ou résultats manquants)"
          elif total < EXPECTED_MIN:
              status_emoji = "⚠️"
              status_text  = f"INCOMPLET — seulement {total} tests sur ~33 (run probablement coupé avant la fin)"
          elif failed > 0:
              status_emoji = "❌"
              status_text  = f"ÉCHEC — {failed} test(s) en erreur"
          else:
              status_emoji = "✅"
              status_text  = "SUCCÈS"

          # Collecter les détails par test
          tests_lines = []
          def walk(suites):
              for suite in suites:
                  for spec in suite.get('specs', []):
                      for test in spec.get('tests', []):
                          status = test.get('status', '')
                          title  = spec.get('title', '')
                          if status == 'expected':
                              tests_lines.append(f"✅ {title}")
                          elif status == 'unexpected':
                              tests_lines.append(f"❌ {title}")
                          elif status == 'skipped':
                              tests_lines.append(f"⏭️  {title} (skippé)")
                  walk(suite.get('suites', []))
          walk(data.get('suites', []))

          if not tests_lines:
              tests_lines = ["(aucun test enregistré — résultats vides ou run interrompu)"]

          now = datetime.datetime.now().strftime('%d/%m/%Y à %Hh%M')
          commit = os.environ.get('GITHUB_SHA', 'inconnu')[:7]
          run_url = f"https://github.com/{os.environ.get('GITHUB_REPOSITORY','')}/actions/runs/{os.environ.get('GITHUB_RUN_ID','')}"

          subject = f"Vadrou Tests {status_emoji} {status_text} — {now}"

          body = f"""Rapport de tests automatiques Vadrou
          ======================================
          Date    : {now}
          Commit  : {commit}
          Durée   : {duration}s
          
          Résultat global : {status_emoji} {status_text}
          ✅ Passés  : {passed}/{total}
          ❌ Échoués : {failed}/{total}
          ⏭️  Skippés : {skipped}/{total}
          
          Détail des tests :
          ------------------
          """ + "\n          ".join(tests_lines) + f"""
          
          Voir le run complet : {run_url}
          """

          # Nettoyer l'indentation
          body = "\n".join(line.strip() for line in body.split("\n"))

          with open('email_subject.txt', 'w') as f:
              f.write(subject)
          with open('email_body.txt', 'w') as f:
              f.write(body)

          print(f"Email généré : {subject}")
          print(f"Tests : {passed} ✅ / {failed} ❌ / {skipped} ⏭️  (total {total})")
          PYEOF

      - name: Lire le contenu de l'email
        if: always()
        id: email_content
        run: |
          echo "subject=$(cat email_subject.txt)" >> $GITHUB_OUTPUT
          echo "body<<EOF_BODY" >> $GITHUB_OUTPUT
          cat email_body.txt >> $GITHUB_OUTPUT
          echo "EOF_BODY" >> $GITHUB_OUTPUT

      - name: Envoyer le rapport par email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: bahrisoumaya@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.email_content.outputs.subject }}
          body: ${{ steps.email_content.outputs.body }}
          to: bahrisoumaya@gmail.com
          from: Vadrou Tests <bahrisoumaya@gmail.com>

      - name: Upload rapport HTML (archive)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-tests-${{ github.run_number }}
          path: playwright-report/
          retention-days: 7
