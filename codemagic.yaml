workflows:
  ios-release:
    name: Vadrou iOS — App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - app_store
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.vadrou.app
      vars:
        BUNDLE_ID: com.vadrou.app
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        APP_STORE_APPLE_ID: "6771132877"
        MARKETING_VERSION: "1.8"
      node: 18
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Install Capacitor CLI and iOS
        script: |
          npm install @capacitor/cli@^6 @capacitor/core@^6 @capacitor/ios@^6 @capacitor/app@^6 @capacitor/device@^6 @capacitor/preferences@^6 @capacitor/geolocation@^6 @capacitor/push-notifications@^6
      - name: Prepare web assets
        script: |
          mkdir -p www
          cp index.html www/index.html
          [ -f admin.html ] && cp admin.html www/admin.html || true
          [ -d api ] && cp -r api www/api || true
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/App/App/GoogleService-Info.plist
      - name: Sync Capacitor
        script: ./node_modules/.bin/cap sync ios
      - name: Set bundle identifier and capabilities
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" ios/App/App/Info.plist
          GEO_MSG="Vadrou utilise ta position pour afficher les lieux les plus proches de toi."
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string $GEO_MSG" ios/App/App/Info.plist \
            || /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription $GEO_MSG" ios/App/App/Info.plist
          # Garantir que App.entitlements contient aps-environment
          /usr/libexec/PlistBuddy -c "Add :aps-environment string production" ios/App/App/App.entitlements 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :aps-environment string production" ios/App/App/App.entitlements
          echo "App.entitlements:"
          cat ios/App/App/App.entitlements
      - name: Set versions
        script: |
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $MARKETING_VERSION;/g" "$XCODE_PROJECT/project.pbxproj"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARKETING_VERSION" ios/App/App/Info.plist
          echo "MARKETING_VERSION -> $MARKETING_VERSION"
          TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          AS=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          [ -z "$TF" ] && TF=0
          [ -z "$AS" ] && AS=0
          if [ "$TF" -ge "$AS" ]; then LATEST=$TF; else LATEST=$AS; fi
          NEXT=$((LATEST + 1))
          echo "Build -> $NEXT"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9][0-9]*;/CURRENT_PROJECT_VERSION = $NEXT;/g" "$XCODE_PROJECT/project.pbxproj"
      - name: Fetch signing files (avec Push Notifications)
        script: |
          # --create force la création d'un nouveau profil incluant Push Notifications
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @env:APP_STORE_CONNECT_PRIVATE_KEY \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" 2>/dev/null || \
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build iOS
        script: |
          echo "=== App.entitlements ==="
          cat ios/App/App/App.entitlements

          PBXPROJ="$XCODE_PROJECT/project.pbxproj"
          if grep -q "CODE_SIGN_ENTITLEMENTS" "$PBXPROJ"; then
            sed -i '' 's|CODE_SIGN_ENTITLEMENTS = .*|CODE_SIGN_ENTITLEMENTS = App/App.entitlements;|g' "$PBXPROJ"
          else
            sed -i '' '/CODE_SIGN_IDENTITY = "Apple Distribution";/{
              a\\t\t\t\tCODE_SIGN_ENTITLEMENTS = App/App.entitlements;
            }' "$PBXPROJ"
          fi

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive \
            OTHER_CODE_SIGN_FLAGS="--keychain login" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=$CM_TEAM_ID
      - name: Export IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

          echo "=== Patch aps-environment dans l'IPA ==="
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          echo "IPA: $IPA"
          WORK=$(mktemp -d)
          unzip -q "$IPA" -d "$WORK"
          APP=$(ls -d "$WORK"/Payload/*.app | head -1)
          echo "App: $APP"

          # Entitlements actuels
          codesign -d --entitlements :- "$APP" 2>/dev/null > /tmp/ent.plist
          echo "Entitlements avant patch:"
          cat /tmp/ent.plist

          # Injecter aps-environment si absent
          if ! grep -q "aps-environment" /tmp/ent.plist; then
            echo ">>> Injection aps-environment..."
            /usr/libexec/PlistBuddy -c "Add :aps-environment string production" /tmp/ent.plist 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :aps-environment string production" /tmp/ent.plist
            cat /tmp/ent.plist

            CERT=$(security find-identity -v -p codesigning | grep "Apple Distribution" | head -1 | awk '{print $2}')
            echo "Certificat: $CERT"

            codesign --force --sign "$CERT" \
              --entitlements /tmp/ent.plist \
              --timestamp \
              "$APP"
            echo "Re-signature OK"

            # Rezipper l'IPA (chemin ABSOLU car on fait cd dans $WORK)
            IPA_ABS="$(cd "$(dirname "$IPA")" && pwd)/$(basename "$IPA")"
            rm "$IPA_ABS"
            (cd "$WORK" && zip -qr "$IPA_ABS" Payload/)
            echo "IPA repackagé: $IPA_ABS"
            ls -la "$IPA_ABS"
          else
            echo "aps-environment déjà présent, pas de patch nécessaire"
          fi

          echo "=== Entitlements finaux ==="
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          WORK2=$(mktemp -d)
          unzip -q "$IPA" -d "$WORK2"
          APP2=$(ls -d "$WORK2"/Payload/*.app | head -1)
          codesign -d --entitlements :- "$APP2" 2>/dev/null | grep -A1 "aps-environment" || echo "ABSENT"
      - name: DIAGNOSTIC entitlements IPA
        script: |
          echo "======================================================"
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          WORK=$(mktemp -d)
          unzip -q "$IPA" -d "$WORK"
          APP=$(ls -d "$WORK"/Payload/*.app | head -1)
          echo "--- aps-environment dans le binaire ---"
          codesign -d --entitlements :- "$APP" 2>/dev/null | grep -A1 "aps-environment" || echo "ABSENT du binaire"
          echo "--- aps-environment dans le profil ---"
          PROFILE="$APP/embedded.mobileprovision"
          security cms -D -i "$PROFILE" 2>/dev/null > "$WORK/profile.plist"
          echo "Profil: $(/usr/libexec/PlistBuddy -c 'Print :Name' "$WORK/profile.plist" 2>/dev/null)"
          /usr/libexec/PlistBuddy -c "Print :Entitlements:aps-environment" "$WORK/profile.plist" 2>/dev/null || echo "ABSENT du profil"
          echo "======================================================"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  # ==========================================================================
  #  ANDROID — build + signature dans le cloud (remplace build-vadrou.bat)
  # ==========================================================================
  android-release:
    name: Vadrou Android — Google Play
    max_build_duration: 45
    instance_type: mac_mini_m2   # seul type inclus dans le plan gratuit
    environment:
      groups:
        - android_firebase            # contient GOOGLE_SERVICES_JSON (base64)
      android_signing:
        - vadrou_keystore             # keystore importé dans Codemagic (même nom)
      vars:
        # A incrementer A CHAQUE build envoyé sur le Play Store
        # (doit toujours être supérieur au dernier versionCode publié).
        ANDROID_VERSION_CODE: "47"
        ANDROID_VERSION_NAME: "5.1"
      node: 18
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Prepare web assets + Firebase
        script: |
          set -e
          if [ "$ANDROID_VERSION_CODE" = "0" ]; then
            echo "ERREUR : renseigne ANDROID_VERSION_CODE et ANDROID_VERSION_NAME dans codemagic.yaml"
            exit 1
          fi
          mkdir -p www
          cp index.html www/index.html
          [ -f admin.html ] && cp admin.html www/admin.html || true
          [ -d api ] && cp -r api www/api || true
          # APP_VERSION (popup de mise a jour) doit valoir le versionCode du build
          sed -i '' "s/const APP_VERSION *= *[0-9]*/const APP_VERSION = $ANDROID_VERSION_CODE/" www/index.html
          grep -o "const APP_VERSION = [0-9]*" www/index.html
          # google-services.json (Firebase push Android) injecte depuis Codemagic
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          python3 -m json.tool android/app/google-services.json > /dev/null && echo "google-services.json OK"
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Set versions
        script: |
          set -e
          GRADLE=android/app/build.gradle
          sed -i '' -E "s/versionCode +[0-9]+/versionCode $ANDROID_VERSION_CODE/" $GRADLE
          sed -i '' -E "s/versionName +\"[^\"]*\"/versionName \"$ANDROID_VERSION_NAME\"/" $GRADLE
          grep -E "versionCode|versionName" $GRADLE
      - name: Build AAB + APK
        script: |
          set -e
          cd android
          sed -i '' 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon
      - name: Sign AAB (Play Store) + APK (installation directe)
        script: |
          set -e
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$CM_KEYSTORE_PATH" -storepass "$CM_KEYSTORE_PASSWORD" \
            -keypass "$CM_KEY_PASSWORD" "$AAB" "$CM_KEY_ALIAS"
          jarsigner -verify "$AAB" | tail -1

          # APK signe (v2) pour l'installer directement sur un telephone
          APK_DIR=android/app/build/outputs/apk/release
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT="$SDK/build-tools/$(ls "$SDK/build-tools" | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
          echo "build-tools : $BT"
          "$BT/zipalign" -f -p 4 "$APK_DIR/app-release-unsigned.apk" "$APK_DIR/app-release-aligned.apk"
          "$BT/apksigner" sign --ks "$CM_KEYSTORE_PATH" --ks-pass env:CM_KEYSTORE_PASSWORD \
            --ks-key-alias "$CM_KEY_ALIAS" --key-pass env:CM_KEY_PASSWORD \
            --out "$APK_DIR/app-release.apk" "$APK_DIR/app-release-aligned.apk"
          "$BT/apksigner" verify "$APK_DIR/app-release.apk" && echo "APK signe OK"
    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab
      - android/app/build/outputs/apk/release/app-release.apk
    publishing:
      email:
        recipients:
          - bahrisoumaya@gmail.com
        notify:
          success: true
          failure: true
