workflows:
  ios-release:
    name: Vadrou iOS — App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.vadrou.app
      vars:
        BUNDLE_ID: com.vadrou.app
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        APP_STORE_APPLE_ID: "6771132877"
        # Version VISIBLE par l'utilisateur (CFBundleShortVersionString).
        # A incrementer DELIBEREMENT a chaque release publiee (1.2 -> 1.3 -> 2.0 ...).
        # Doit toujours etre superieure a la derniere version approuvee sur l'App Store.
        MARKETING_VERSION: "1.7"
      node: 18
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Install Capacitor CLI and iOS
        script: |
          npm install @capacitor/cli@^6 @capacitor/core@^6 @capacitor/ios@^6 @capacitor/app@^6 @capacitor/device@^6 @capacitor/preferences@^6 @capacitor/geolocation@^6 @capacitor/push-notifications@^6
      - name: Prepare web assets
        script: |
          # Créer le dossier www et y copier index.html
          mkdir -p www
          cp index.html www/index.html
          # Copier aussi admin.html si présent
          [ -f admin.html ] && cp admin.html www/admin.html || true
          # Copier api/ si présent
          [ -d api ] && cp -r api www/api || true
          # Injecter GoogleService-Info.plist (Firebase iOS push notifications)
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/App/App/GoogleService-Info.plist
      - name: Sync Capacitor
        script: ./node_modules/.bin/cap sync ios
      - name: Set bundle identifier
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" ios/App/App/Info.plist
          # Autorisation de localisation
          GEO_MSG="Vadrou utilise ta position pour afficher les lieux les plus proches de toi."
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string $GEO_MSG" ios/App/App/Info.plist \
            || /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription $GEO_MSG" ios/App/App/Info.plist
          # S'assurer que l'entitlement aps-environment est bien dans App.entitlements
          /usr/libexec/PlistBuddy -c "Add :aps-environment string production" ios/App/App/App.entitlements 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :aps-environment string production" ios/App/App/App.entitlements
      - name: Set versions (marketing deliberee + build auto-incremente)
        script: |
          # 1) Version VISIBLE : valeur de la variable MARKETING_VERSION (decision produit)
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $MARKETING_VERSION;/g" "$XCODE_PROJECT/project.pbxproj"
          # Forcer aussi dans Info.plist (fallback si project.pbxproj ne suffit pas)
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARKETING_VERSION" ios/App/App/Info.plist
          echo "MARKETING_VERSION (version visible) -> $MARKETING_VERSION"

          # 2) Numero de BUILD : dernier connu (App Store + TestFlight) + 1, toujours croissant
          TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          AS=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          [ -z "$TF" ] && TF=0
          [ -z "$AS" ] && AS=0
          if [ "$TF" -ge "$AS" ]; then LATEST=$TF; else LATEST=$AS; fi
          NEXT=$((LATEST + 1))
          echo "Build (CFBundleVersion) : dernier connu (TF=$TF, AS=$AS) -> $NEXT"
          # CURRENT_PROJECT_VERSION pilote CFBundleVersion (2 occurrences : Debug + Release)
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9][0-9]*;/CURRENT_PROJECT_VERSION = $NEXT;/g" "$XCODE_PROJECT/project.pbxproj"

          echo "Verification :"
          grep -E "MARKETING_VERSION|CURRENT_PROJECT_VERSION" "$XCODE_PROJECT/project.pbxproj"
      - name: Build iOS
        script: |
          xcode-project use-profiles
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive \
            OTHER_CODE_SIGN_FLAGS="--keychain login" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=$CM_TEAM_ID \
            CODE_SIGN_ENTITLEMENTS=App/App/App.entitlements
      - name: Export IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
